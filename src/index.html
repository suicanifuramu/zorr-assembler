<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#121916" />
    <meta
      name="description"
      content="Zorr の Assembler レシピを確認。現在・前後のレシピと、これからのスケジュールを Super カラーで表示します。"
    />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="stylesheet" href="__STYLE_URL__" />
    <title>Assembler — Zorr</title>
  </head>
  <body>
    <a class="skip-link" href="#main">レシピへ移動</a>
    <header class="site-header wrap">
      <a class="brand" href="./" aria-label="Zorr Assembler ホーム">
        <img src="./icon.svg" alt="" width="36" height="36" />
        <span
          >ZORR <span class="brand-divider">/</span>
          <strong>ASSEMBLER</strong></span
        >
      </a>
      <a
        class="game-link"
        href="https://zorr.pages.dev/"
        target="_blank"
        rel="noopener noreferrer"
        >Zorr を開く <span aria-hidden="true">↗</span></a
      >
    </header>
    <main class="wrap" id="main">
      <div class="page-heading">
        <div>
          <p class="eyebrow">RECIPE VIEWER</p>
          <h1>Assembler</h1>
          <p class="page-description">いまのレシピと、このあとの組み合わせ。</p>
        </div>
        <div class="display-info">
          <span class="super-badge"
            ><span aria-hidden="true"></span>
            <span id="rarity-name">Super</span></span
          >
          <span>1回分の必要個数</span>
        </div>
      </div>
      <div class="clock-bar">
        <p>
          <span class="live-dot" aria-hidden="true"></span>
          <span id="clock">時刻を確認中</span><span class="zone">JST</span>
        </p>
        <a href="#schedule"
          >このあとのレシピ <span aria-hidden="true">↓</span></a
        >
      </div>
      <div id="loading" class="loading" role="status">
        レシピを読み込んでいます…
      </div>
      <div id="error" class="error" role="alert" hidden>
        <p>レシピを読み込めませんでした。</p>
        <button type="button" id="retry">再読み込み</button>
      </div>
      <section
        id="featured"
        class="featured"
        aria-label="現在と前後のレシピ"
        hidden
      ></section>
      <section
        id="schedule"
        class="schedule"
        aria-labelledby="schedule-title"
        hidden
      >
        <div class="section-heading">
          <div>
            <p class="eyebrow">UPCOMING</p>
            <h2 id="schedule-title">このあとのレシピ</h2>
          </div>
          <p id="schedule-summary"></p>
        </div>
        <div class="schedule-toolbar">
          <p>時刻順 <span class="separator">/</span> 日本時間</p>
          <label class="search-field"
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              aria-hidden="true"
            >
              <circle cx="10.5" cy="10.5" r="6.5" />
              <path d="m16 16 4 4" /></svg
            ><span class="sr-only">このあとのレシピをペタル名で検索</span
            ><input
              id="search"
              type="search"
              placeholder="ペタル名で検索"
              autocomplete="off"
              spellcheck="false"
          /></label>
        </div>
        <div id="timeline"></div>
        <p id="empty" class="empty" role="status" hidden>
          一致するレシピがありません。
        </p>
        <p id="search-results" class="sr-only" aria-live="polite"></p>
      </section>
      <div id="announcement" class="sr-only" aria-live="polite"></div>
    </main>
    <footer class="site-footer wrap">
      <div class="footer-main">
        <span class="footer-brand">ZORR ASSEMBLER</span>
        <p>Super カラー · アイコン内は最少の本体数 · 時刻で自動切り替え</p>
      </div>
      <div class="footer-details">
        <span id="source-updated"></span
        ><a
          id="source-link"
          href="https://zorr.pages.dev/"
          target="_blank"
          rel="noopener noreferrer"
          >データ取得元 ↗</a
        ><a
          href="https://github.com/suicanifuramu/zorr-assembler"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub ↗</a
        >
      </div>
    </footer>
    <noscript
      ><p class="wrap error">
        現在の時刻に合ったレシピを表示するには JavaScript を有効にしてください。
      </p></noscript
    >
    <script type="module" src="__APP_URL__"></script>
  </body>
</html>
